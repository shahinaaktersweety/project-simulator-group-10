<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - ProjectFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="profile.html" class="brand">ProjectFlow</a>
        <div class="nav-links">
            <a href="projects.html">Projects</a>
            <a href="create-project.html">Create Project</a>
            <a href="report.html">Report</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="Settings.html">Settings</a>
        </div>
    </nav>

    <div class="container">
        <form id="changePassForm">
            <div class="header-row">
                <h2 class="page-title">Change Password</h2>
                <div class="sub-nav">
                    <button type="button" class="nav-btn" id="profileBtn">Profile</button>
                    <button type="button" class="nav-btn" id="editProfileBtn">Edit Profile</button>
                    <button type="button" class="nav-btn" id="settingsBtn">Settings</button>
                </div>
            </div>

            <div class="form-group">
                <label for="currentPass">Current Password</label>
                <input type="password" id="currentPass" placeholder="Enter current password">
            </div>

            <div class="form-group">
                <label for="newPass">New Password</label>
                <input type="password" id="newPass" placeholder="Enter new password">
            </div>

            <div class="form-group">
                <label for="confirmPass">Confirm New Password</label>
                <input type="password" id="confirmPass" placeholder="Re-enter new password">
            </div>

            <p class="hint-text" id="passError">
                Password must be at least 8 characters.
            </p>

            <div class="bottom-buttons">
                <button type="submit" class="btn save">Save Changes</button>
                <button type="button" class="btn back" id="backBtn">Back</button>
                <button type="button" class="btn exit" id="exitBtn">Exit</button>
            </div>
        </form>
    </div>

    <script src="password.js"></script>
</body>
</html>
