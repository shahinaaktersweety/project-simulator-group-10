<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }

    .label {
      max-width: 900px;
      margin: 0 auto 8px;
      font-size: 11px;
    }

    .panel {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 40px 48px;
    }

    h1 {
      margin: 0 0 32px;
      text-align: center;
      font-size: 34px;
    }

    .bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    button {
      border: 1px solid #999;
      padding: 14px 0;
      font: inherit;
      font-size: 24px;
      cursor: pointer;
    }

    .add {
      width: 44%;
    }

    .back {
      width: 28%;
      border-radius: 8px;
    }

    #search {
      width: 100%;
      margin-bottom: 34px;
      padding: 12px 20px;
      border: 1px solid #999;
      border-radius: 6px;
      font: inherit;
      font-size: 22px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 24px;
    }

    th,
    td {
      height: 60px;
      padding: 8px;
      border: 1px solid #999;
      text-align: center;
    }

    @media (max-width: 600px) {
      .panel {
        padding: 24px 16px 32px;
      }

      h1 {
        font-size: 26px;
      }

      button,
      table {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="label">Client</div>

  <div class="panel">

    <h1>Welcome Client</h1>

    <div class="bar">
      <button class="add" id="add">Add Client</button>
      <button class="back" id="back">Back</button>
    </div>

    <input id="search" placeholder="Search..">

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Project</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td></tr>
      </tbody>
    </table>

  </div>

  <script>
    document.getElementById('add').onclick = () => {
      location.href = 'add-client.html';
    };

    document.getElementById('back').onclick = () => {
      history.back();
    };
  </script>

</body>

</html>
