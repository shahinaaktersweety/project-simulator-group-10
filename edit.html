<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - ProjectFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="profile.html" class="brand">ProjectFlow</a>
        <div class="nav-links">
            <a href="projects.html">Projects</a>
            <a href="create-project.html">Create Project</a>
            <a href="report.html">Report</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="Settings.html">Settings</a>
        </div>
    </nav>

    <div class="container">
        <form id="editProfileForm">
            <div class="header-row">
                <h2 class="page-title">Edit Profile</h2>
                <div class="sub-nav">
                    <button type="button" class="nav-btn" id="profileBtn">Profile</button>
                    <button type="button" class="nav-btn" id="settingsBtn">Settings</button>
                    <button type="button" class="nav-btn" id="changePassBtn">Change Password</button>
                </div>
            </div>

            <div class="change-photo-box" id="photoBox">
                <div class="avatar-circle">👤</div>
                <div>
                    <span id="photoText">Change Profile Photo</span>
                    <p class="photo-subtext">Click to upload a new picture (JPG, PNG)</p>
                </div>
                <input type="file" id="photoInput" accept="image/*" style="display: none;">
            </div>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label for="emailAddr">E-mail Address</label>
                <input type="email" id="emailAddr" placeholder="Enter email address">
            </div>

            <div class="form-group">
                <label for="phoneNum">Phone Number</label>
                <input type="text" id="phoneNum" placeholder="Enter phone number">
            </div>

            <div class="form-group">
                <label for="userRole">Role</label>
                <select id="userRole">
                    <option value="Project Manager">Project Manager</option>
                    <option value="Software Developer">Software Developer</option>
                    <option value="UI/UX Designer">UI/UX Designer</option>
                    <option value="Team Lead">Team Lead</option>
                </select>
            </div>

            <span class="error" id="editError"></span>

            <div class="bottom-buttons">
                <button type="submit" class="btn save">Save Changes</button>
                <button type="button" class="btn back" id="backBtn">Back</button>
                <button type="button" class="btn exit" id="exitBtn">Exit</button>
            </div>
        </form>
    </div>

    <script src="edit.js"></script>
</body>
</html>
